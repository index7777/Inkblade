<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幀率環境檢測 v2 · 累加式</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{background:#14120f;color:#ddd4c0;font:14px/1.7 ui-monospace,Menlo,Consolas,monospace}
  /* 真正可見、佔滿視窗的畫布 —— 與遊戲相同的合成條件 */
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #ui{position:relative;z-index:5;padding:20px;height:100%;overflow:auto}
  h1{font-size:17px;letter-spacing:2px;color:#f0e2b8}
  .sub{color:#8a8070;font-size:12.5px;margin-bottom:14px}
  table{border-collapse:collapse;width:100%;max-width:820px;margin-top:16px;
        background:rgba(20,18,15,.92)}
  th,td{border:1px solid #3a352c;padding:7px 10px;text-align:left}
  th{background:#221f19;color:#c8bda0;font-weight:400;font-size:12.5px}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:#8ec07c}.warn{color:#e0a050}.bad{color:#e06a5a}
  #env,#note{max-width:820px;background:rgba(28,26,21,.94);border:1px solid #3a352c;
       border-radius:6px;padding:12px 14px;white-space:pre-wrap;font-size:12.5px;color:#b8ae98}
  #note{margin-top:16px;color:#ddd4c0}
  #run{cursor:pointer;background:#2e2a22;border:1px solid #5a5244;color:#f0e2b8;
       padding:9px 20px;border-radius:6px;font:inherit;letter-spacing:2px;margin-top:14px}
  /* 模擬遊戲的毛玻璃遮罩(平時 display:none) */
  .mask{position:fixed;inset:0;z-index:3;display:none;background:rgba(25,22,18,.55);
        backdrop-filter:blur(3px)}
  .mask.on{display:block}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="mask" id="mask"></div>
<div id="ui">
  <h1>幀率環境檢測 v2 · 累加式</h1>
  <div class="sub">畫布這次是真正可見的滿版畫布。每一階都保留前一階的負擔,再多加一項,看哪一項按下去才崩。每階 3 秒。</div>
  <div id="env">偵測中…</div>
  <button id="run">開始檢測</button>
  <table id="tb">
    <tr><th>階段</th><th>累加的項目</th><th class="n">fps</th><th class="n">p50</th><th class="n">p95</th><th class="n">JS</th></tr>
  </table>
  <div id="note" style="display:none"></div>
</div>
<script>
(function(){
'use strict';
const cv=document.getElementById('stage'), ctx=cv.getContext('2d');
const tb=document.getElementById('tb'), noteEl=document.getElementById('note');
let DPR=Math.min(window.devicePixelRatio||1,2), W=0,H=0, off=null, off2=null;
function resize(){
  const r=cv.getBoundingClientRect();
  W=Math.round(r.width); H=Math.round(r.height);
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  off=null; off2=null;
}
addEventListener('resize',resize); resize();
function layers(){
  if(off) return;
  off=document.createElement('canvas'); off.width=W*DPR; off.height=H*DPR;
  const g=off.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#e9e0cc'; g.fillRect(0,0,W,H);
  off2=document.createElement('canvas'); off2.width=W*DPR; off2.height=H*DPR;
  const g2=off2.getContext('2d'); g2.setTransform(DPR,0,0,DPR,0,0);
  const vg=g2.createRadialGradient(W/2,H/2,Math.min(W,H)*.34,W/2,H/2,Math.max(W,H)*.72);
  vg.addColorStop(0,'rgba(60,48,34,0)'); vg.addColorStop(1,'rgba(60,48,34,.3)');
  g2.fillStyle=vg; g2.fillRect(0,0,W,H);
}
function gpu(){
  try{ const c=document.createElement('canvas');
    const gl=c.getContext('webgl')||c.getContext('experimental-webgl');
    if(!gl) return 'WebGL 不可用';
    const e=gl.getExtension('WEBGL_debug_renderer_info');
    return String(e?gl.getParameter(e.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER));
  }catch(err){ return '偵測失敗'; }
}
document.getElementById('env').textContent=
  'DPR            '+(window.devicePixelRatio||1)+'  (畫布用 '+DPR+')\n'+
  '視窗           '+innerWidth+'×'+innerHeight+'   畫布像素 '+(W*DPR|0)+'×'+(H*DPR|0)+'\n'+
  '螢幕           '+screen.width+'×'+screen.height+(screen.isExtended?'  (多螢幕)':'')+'\n'+
  'GPU            '+gpu()+'\n'+
  '硬體執行緒     '+(navigator.hardwareConcurrency||'?');

// ---- 音訊(與遊戲相同的兩項:mp3 元素 + WebAudio 殘響) ----
let au=null, ac=null, rv=null, sg=null, sfxTimer=null, noiseBuf=null;
function startMp3(){
  if(au) return;
  au=new Audio(); au.src='assets/audio/bgm/battle01.mp3'; au.loop=true; au.volume=.25;
  const p=au.play(); if(p&&p.catch) p.catch(()=>{});
}
function startWebAudio(){
  if(ac) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  ac=new AC();
  const master=ac.createGain(); master.gain.value=.5; master.connect(ac.destination);
  rv=ac.createConvolver();
  const n=(ac.sampleRate*1.05)|0, b=ac.createBuffer(2,n,ac.sampleRate);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6); }
  rv.buffer=b;
  const rg=ac.createGain(); rg.gain.value=.3; rv.connect(rg); rg.connect(master);
  sg=ac.createGain(); sg.gain.value=.25; sg.connect(master); sg.connect(rv);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  // 模擬戰鬥中密集的音效(每 120ms 一次)
  sfxTimer=setInterval(()=>{
    const t=ac.currentTime;
    const o=ac.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(440,t);
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.2,t+.005);
    g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.connect(g); g.connect(sg); o.start(t); o.stop(t+.55);
    const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500;
    const g2=ac.createGain(); g2.gain.setValueAtTime(.15,t);
    g2.gain.exponentialRampToValueAtTime(.0001,t+.12);
    s.connect(bp); bp.connect(g2); g2.connect(sg); s.start(t); s.stop(t+.15);
  },120);
}
function stopAudio(){
  if(sfxTimer){ clearInterval(sfxTimer); sfxTimer=null; }
  if(au){ au.pause(); au=null; }
  if(ac){ try{ac.close();}catch(e){} ac=null; }
}

// ---- 累加式階段 ----
const STAGES=[
  {n:'A', d:'可見滿版畫布,但每幀不重畫(只跑 rAF)', draw:null},
  {n:'B', d:'+ 每幀滿版 fillRect 純色', draw(){ ctx.fillStyle='#e9e0cc'; ctx.fillRect(0,0,W,H); }},
  {n:'C', d:'+ 每幀滿版 drawImage 離屏圖層 ×2', draw(){
      layers(); ctx.drawImage(off,0,0,W,H); ctx.drawImage(off2,0,0,W,H); }},
  {n:'D', d:'+ 播放 battle01.mp3', pre:startMp3, draw(){
      layers(); ctx.drawImage(off,0,0,W,H); ctx.drawImage(off2,0,0,W,H); }},
  {n:'E', d:'+ WebAudio 殘響 + 密集音效', pre:startWebAudio, draw(){
      layers(); ctx.drawImage(off,0,0,W,H); ctx.drawImage(off2,0,0,W,H); }},
  {n:'F', d:'+ 毛玻璃遮罩(backdrop-filter)覆蓋全螢幕',
      pre(){ document.getElementById('mask').classList.add('on'); },
      post(){ document.getElementById('mask').classList.remove('on'); },
      draw(){ layers(); ctx.drawImage(off,0,0,W,H); ctx.drawImage(off2,0,0,W,H); }},
];
function run(st){
  return new Promise(res=>{
    const gaps=[]; let jsT=0,jsN=0,last=0,t0=0;
    function f(ts){
      if(!t0) t0=ts;
      if(last) gaps.push(ts-last);
      last=ts;
      if(st.draw){ const a=performance.now(); st.draw(); jsT+=performance.now()-a; jsN++; }
      if(ts-t0<3000) requestAnimationFrame(f);
      else{ gaps.sort((a,b)=>a-b);
        const q=x=>gaps[Math.min(gaps.length-1,Math.floor(gaps.length*x))]||0;
        res({p50:q(.5),p95:q(.95),js:jsN?jsT/jsN:0}); }
    }
    requestAnimationFrame(f);
  });
}
const cls=f=>f>=55?'ok':f>=40?'warn':'bad';
document.getElementById('run').onclick=async function(){
  this.disabled=true; this.textContent='檢測中…';
  while(tb.rows.length>1) tb.deleteRow(1);
  noteEl.style.display='none';
  const out=[];
  for(const st of STAGES){
    if(st.pre) st.pre();
    const r=await run(st);
    if(st.post) st.post();
    const fps=1000/r.p50; out.push({n:st.n,d:st.d,fps});
    const tr=tb.insertRow();
    tr.innerHTML='<td>'+st.n+'</td><td>'+st.d+'</td>'
      +'<td class="n '+cls(fps)+'">'+fps.toFixed(0)+'</td>'
      +'<td class="n">'+r.p50.toFixed(1)+'</td>'
      +'<td class="n">'+r.p95.toFixed(1)+'</td>'
      +'<td class="n">'+r.js.toFixed(2)+'</td>';
  }
  stopAudio();
  ctx.clearRect(0,0,W,H);
  const bad=out.find(o=>o.fps<45);
  noteEl.style.display='block';
  noteEl.textContent = bad
    ? '➜ 從階段 '+bad.n+' 開始崩:「'+bad.d.replace(/^\+ /,'')+'」就是元凶。'
    : '六階全部正常。那遊戲裡還有這頁沒複製到的因素,把這張表回報給我,我再往下切。';
  this.disabled=false; this.textContent='再測一次';
};
})();
</script>
</body>
</html>
